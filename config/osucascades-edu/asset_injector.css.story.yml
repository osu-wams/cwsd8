id: story
label: Story
code: |-
  /*==============================================================================
  											Story Titles (on full content)
  ==============================================================================*/

  .osustory-title{
  	font-size: calc(3rem + 2.1vw) !important;
  	font-weight: 800;
  }

  @media (min-width: 1200px) {
  	.osustory-title{
  		font-size: calc(3rem + 2.1vw) !important;
  		font-weight: 800;
  	}
  }

  /*==============================================================================
  							Comma between quote author name and title fields
  ==============================================================================*/

  .block-field-blocknodestoryfield-quote-author .block__content .field__item::after, 
  .block-field-blockblock-contentstory-quotefield-author .block__content .field__item::after{
  	content: ", ";
  }

  /*==============================================================================
  										Quotes image sizing and positioning
  ==============================================================================*/

  .story-bg-quotes article img{
    width: auto;
    height: 200px;
    margin-top: -200px;
  }

  .osustory-btn-sm a{
  	padding-top: 0;
  	padding-bottom: 0;
  	padding-left: 10px;
  	padding-right: 10px;
  	font-size: 0.8rem;
  }

  /*==============================================================================
  									Quotes author + title mobile styling
  ==============================================================================*/

  @media (max-width: 420px){
  	.block-field-blocknodestoryfield-quote-author{
  		position: relative;
  		text-shadow: 1px 1px 5px black;
  		padding-bottom: 0 !important;
  	}
  	
  	.block-field-blocknodestoryfield-quote-title{
  		padding-left: 48px !important;
  	}
  }

  /*==============================================================================
  										Story Tags (On All Stories section)
  ==============================================================================*/

  .stories-tags-sm ul{
  	display: flex;
  	padding-left: 0;
  	gap: 3px;
  	position:absolute;
  	top: 5px;
  	right: 5px;
  }

  .stories-tags-sm li{
    list-style: none;
    background: #ffffffdb;
    text-align: center;
    width: fit-content;
    padding-left: 5px;
    padding-right: 5px;
    border-radius: 5px;
    font-size: 12px;
    font-weight:bold;
  }

  .stories-tags-sm li::marker{
  	content: "" !important;
  }

  /*==============================================================================
  										Carousel indicators styling
  ==============================================================================*/

  .osufeatured-stories .carousel .carousel-indicators{
  	background-color: #d73f0900 !important;
  }

  .osufeatured-stories .carousel .carousel-indicators button{
  	height: 10px !important;
  	width: 10px !important;
  	border-radius: 50% !important;
  }

  /*==============================================================================
  								Featured story banner and caption sizing
  ==============================================================================*/

  .osufeatured-stories .carousel-inner img{
  	width: 100%;
    height: 700px;
    object-fit: cover;
    filter: brightness(0.7);
  }

  .osufeatured-stories .carousel .carousel-caption {
  	background: #f7f5f500 !important;
  	color: white !important;
  	display: flex;
  	height: 600px;
  	justify-content: center;
  	align-items: center;
  }

  @media (max-width: 991px){
  	.osufeatured-stories .carousel-inner img{
  	  height: 500px;
  	}
  	
  	.osufeatured-stories .carousel .carousel-caption {
  		height: 400px;
  	}
  }

  @media (max-width: 768px){
  	.osufeatured-stories .carousel-inner img{
  	  height: 400px;
  	}
  	
  	.osufeatured-stories .carousel .carousel-caption {
  		height: 300px;
  	}
  }

  /*==============================================================================
  								Featured story extra title hidden
  ==============================================================================*/

  .osufeatured-stories .carousel .carousel-caption h3:nth-child(1){
  	display: none!important;
  }

  /*==============================================================================
  											Top Stories Image Filter
  ==============================================================================*/

  .osutop-stories img{
  	filter:brightness(0.5);
  	transition: filter 1s ease;
  }

  .osutop-stories img:hover{
  	filter:brightness(0.8);
  }

  /*==============================================================================
  									Story tags (On top stories section)
  ==============================================================================*/

  .topstories-tag ul {
  	padding-left: 0 !important;
  	margin-bottom: 0 !important;
  	font-family: "Stratum2Web";
  }

  .topstories-tag ul li::marker {
  	content: "" !important;
  }

  /*==============================================================================
  														Topic Images 
  ==============================================================================*/

  .round-image img {
  	border-radius: 50%;
  }

  .story-topic-hover{
  	transition: 0.3s !important;
  }

  .story-topic-hover:hover{
  	margin-top: -10px;
  	cursor: pointer;
  }

  .story-topic-hover img{
  	width:250px;
  	height:250px;
  	max-height: 250px !important;
  	max-width: 250px !important;
  	object-fit:cover;
  }

  @media (max-width: 1576px){
  	.story-topic-hover img{
  		width: 225px !important;
      height: 225px !important;
  		max-height: 225px !important;
  		max-width: 225px !important;
  	}
  }

  @media (max-width: 1400px){
  	.story-topic-hover img{
  		width: 150px !important;
      height: 150px !important;
  		max-height: 150px !important;
  		max-width: 150px !important;
  	}
  }

  @media (max-width: 1264px){
  	.story-topic-hover img{
  		width: 175px !important;
      height: 175px !important;
  		max-height: 175px !important;
  		max-width: 175px !important;
  	}
  }

  @media (max-width: 1144px){
  	.story-topic-hover img{
  		width: 160px !important;
      height: 160px !important;
  		max-height: 160px !important;
  		max-width: 160px !important;
  	}
  }

  @media (max-width: 1028px){
  	.story-topic-hover img{
  		width: 150px !important;
      height: 150px !important;
  		max-height: 150px !important;
  		max-width: 150px !important;
  	}
  }

  @media (max-width: 991px){
  	.story-topic-hover img{
  		width: 225px !important;
      height: 225px !important;
  		max-height: 225px !important;
  		max-width: 225px !important;
  	}
  }

  @media (max-width: 838px){
  	.story-topic-hover img{
  		width: 210px !important;
      height: 210px !important;
  		max-height: 210px !important;
  		max-width: 210px !important;
  	}
  }

  /*==============================================================================
  											Margin bottom between Q & A's
  ==============================================================================*/

  .block-field-blocknodestoryfield-q-a .block__content .field__item .paragraph, 
  .block-field-blockblock-contentstory-sectionfield-section{
  	margin-bottom: 2rem;
  }

  /*==============================================================================
  											Question font size
  ==============================================================================*/

  .block-field-blocknodestoryfield-q-a .block__content .field__item .field--name-field-p-accordion-title, 
  .block-field-blockblock-contentstory-sectionfield-section .field--name-field-section .field--name-field-p-accordion-title{
  	font-weight: bold;
  	font-size: calc(1.265625rem + 0.1875vw) !important;
  }
