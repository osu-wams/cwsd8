uuid: 6782c395-5a61-4a08-b2f0-91cfe090e451
langcode: en
status: true
dependencies:
  module:
    - block_visibility_groups
id: researc
label: Research
code: |
  /*==============================================================================
  					Hidden Research Stories (remove when there is content)
  ==============================================================================*/

  .research-stories{
  	display: none;
  }

  /*==============================================================================
  						Force image slider full width on large screens
  ==============================================================================*/

  @media (min-width: 1921px){
  	.research-slider img{
  		width: 100% !important;
  	}
  }

  .research-slider img{
  	min-height: 500px;
  	object-fit: cover;
  }

  /*==============================================================================
  												Hero Banner Slider Text
  ==============================================================================*/

  @media (min-width: 900px){
  	.research-slider .views-field-body{
  		position: absolute;
  	  bottom: 3rem;
  	  left: 3rem;
  	  width: 33%;
  	}
  	
  	.research-slider .views-field.views-field-body::before{
  		content: 'Research';
  		background: #d73f09;
  		color: white;
  		font-family: 'Stratum2Web';
  		font-size: 4rem;
  		font-weight: 700;
  		text-transform: uppercase;
  		padding: 5px 15px;
  		max-width: 100%;
  	}
  }

  @media (max-width: 900px){
  	.research-slider .views-field-body{
  		margin-bottom: 1.5rem;
  	}
  	
  	.research-slider .views-field.views-field-field-carousel-image::before{
      content: 'Research';
      background: #d73f09;
      color: white;
      font-family: 'Stratum2Web';
      font-size: 3rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 5px 15px;
      text-align: center;
      position: absolute;
      z-index: 2;
      bottom: 2rem;
      margin: auto 0;
      display: block;
      height: fit-content;
      left: 2rem;
  	}
  }
media: all
preprocess: true
