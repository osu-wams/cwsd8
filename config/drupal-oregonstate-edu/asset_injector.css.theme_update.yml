code: |-
  .osu-hover-scale-img img,
  .osu-hover-scale-icon .fa-solid,
  .osu-hover-scale-icon, .fas {
  	transition: transform 0.2s ease-in-out;
  }

  .osu-hover-scale-img:hover img,
  .osu-hover-scale-icon:hover .fa-solid,
  .osu-hover-scale-icon:hover .fas {
  	transform: scale(1.05);
  }

  .osu-minimal-link,
  .osu-minimal-link > a {
  	text-decoration: none;
  	
  	&:active {
  		background-color: transparent !important;
  		text-decoration: underline;
  }
  }

  .osu-bg-before-dark-ellipse::before {
