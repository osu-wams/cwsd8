id: coe_brand_utility_injector
label: 'COE Brand - Utility'
code: |-
  /************************************************************************
  	SECTION: Border Bar
  	
  	PURPOSE: Applies a border bar to the specified side of an element
  	
  	INSTRUCTIONS:
  		1. Insert class name (ex. border-bar-top-luminance) into block/section
  		2. Configure > Manage Attributes > Block content attributes
  ************************************************************************/
  .border-bar-top {
  	border-top: 10px solid #D73F09;
  }
  .border-bar-bottom {
  	border-bottom: 10px solid #D73F09;
  }


  .border-bar-top-luminance {
  	border-top: 10px solid #FFB500;
  }
  .border-bar-bottom-luminance {
  	border-bottom: 10px solid #FFB500;
  }

  /*------------------------------------------------------------------------------
  	Accent Bar (Top)

  	Variants: .accent-white, .accent-black
  	----------------------------------------------------------------------------*/

  /************************************************************************
  	SECTION: Accent Bar (Top)
  	
  	PURPOSE: Applies a short accent bar to the top an element
  	
  	INSTRUCTIONS:
  		1. Insert class name (ex. accent-top)
  		2. Insert color class name (ex. accent-black), default is orange
  ************************************************************************/
  .accent-top {
  	--accent-color: #D73F09;
  	position: relative;
  }

  .accent-top.accent-white  { --accent-color: #FFF; }
  .accent-top.accent-black  { --accent-color: #000; }

  .accent-top::before {
  	content: "";
  	position: absolute;
  	top: 0;
  	left: 0;
  	width: 75px;
  	border-top: 6px solid var(--accent-color);
  }


  /************************************************************************
  	SECTION: Image Height
  	
  	PURPOSE: Applies a height restriction to images
  	
  	INSTRUCTIONS:
  		1. Insert class name (ex. img-bottom-left-hop-bine) into block 
  		2. Configure > Manage Attributes > Block content attributes
  ************************************************************************/

  .img-height-214 img {
  	height: 214px;
  	object-fit: cover;
  }

  .full-width-image img {
  	width: 100%;
  }
  /************************************************************************
  	SECTION: Hide block
  	
  	PURPOSE: Applies a hidden class to a block or section (doesn't hide in layout builder)
  	
  	INSTRUCTIONS:
  		1. Insert class name (ex. temp-hide) into block 
  		2. Configure > Manage Attributes > Block content attributes
  ************************************************************************/

  .temp-hide {
  	display: none;
  }

  /************************************************************************
  	SECTION: Column Overrides
  	
  	PURPOSE: Used to create a gap between columns in a row
  	
  	INSTRUCTIONS:
  		1. Configure Section > Settings > Columns Settings
  		2. Insert left (Col 1) and right (Col 2) column size classes (the ones below)
  		3. Insert right (Col 2) column offset class (offset-1, offset-2, etc.)
  	
  	EXAMPLE: Col 1: (col-lg-7-important), Col 2: (col-lg-5-important offset-lg-1)
  ************************************************************************/
  @media screen and (min-width: 768px) {
  	.col-md-4-important {
  	  width: 33.33333333% !important;
  	}
  	.col-md-5-important {
  	  width: 41.66666667% !important;
  	}
  	.col-md-6-important {
  	  width: 50% !important;
  	}
  	.col-md-7-important {
  	  width: 58.33333333% !important;
  	}
  	.col-md-10-important {
  	  width: 83.33333333% !important;
  	}
  }

  @media screen and (min-width: 992px) {
  	.col-lg-4-important {
  	  width: 33.33333333% !important;
  	}
  	.col-lg-5-important {
  	  width: 41.66666667% !important;
  	}
  	.col-lg-6-important {
  	  width: 50% !important;
  	}
  	.col-lg-7-important {
  	  width: 58.33333333% !important;
  	}
  	.col-lg-10-important {
  	  width: 83.33333333% !important;
  	}
  }

  @media screen and (min-width: 1200px) {
  	.col-xl-4-important {
  	  width: 33.33333333% !important;
  	}
  	.col-xl-5-important {
  	  width: 41.66666667% !important;
  	}
  	.col-xl-6-important {
  	  width: 50% !important;
  	}
  	.col-xl-7-important {
  	  width: 58.33333333% !important;
  	}
  	.col-xl-10-important {
  	  width: 83.33333333% !important;
  	}
  }

  @media screen and (min-width: 1400px) {
  	.col-xxl-4-important {
  	  width: 33.33333333% !important;
  	}
  	.col-xxl-5-important {
  	  width: 41.66666667% !important;
  	}
  	.col-xxl-6-important {
  	  width: 50% !important;
  	}
  	.col-xxl-7-important {
  	  width: 58.33333333% !important;
  	}
  	.col-xxl-10-important {
  	  width: 83.33333333% !important;
  	}
  }

  /************************************************************************
  	SECTION: Grid 121
  	
  	PURPOSE: Used for common grid layout with the form:
  		Desktop: 1 row
  		Tablet: 2 columns
  		Mobile: 1 column
  	
  	INSTRUCTIONS:
  		1. Insert class name (ex. coe-grid-121) into block
  		2. Configure > Manage Attributes > Block content attributes
  ************************************************************************/
  .coe-grid-121 {
  	display: grid;
  	grid-template-columns: 1fr;
  	gap: 50px 20px;
  }

  @media screen and (min-width: 768px) and (max-width: 991px) {
  	.coe-grid-121 {
  		grid-template-columns: repeat(2, 1fr);
  	}
  }

  @media screen and (min-width: 992px) {
  	.coe-grid-121 {
  		grid-template-columns: none;
  		grid-auto-flow: column;
  		grid-auto-columns: 1fr;
  		gap: 0 20px;
  	}
  }

  /************************************************************************
  	SECTION: Miscellaneous
  ************************************************************************/

  @media screen and (min-width: 768px) {
  	.coe-min-h-300 {
  		min-height: 300px;
  	}
  }

  .seafoam-bg {
  	background-color: rgba(241, 248, 249, 1)
  }

  .light-blue-bg{
  	background-color: #F4F8FA;
  }

  /**********************************
  	Simple column subtitles
  	- Why are these here???
  ***********************************/

  .node--type-coe-simple-column .subtitle {
    display: block;
    width: 100%;
    margin-top: 30px;
  }

  @media (min-width: 992px) {
    .node--type-coe-simple-column .subtitle {
      width: 82%;
    }
  }

  /************************************************************************
  	SECTION: iFrame Aspect Ratio
  ************************************************************************/
  .standard-video iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
  }

  /************************************************************************
  	SECTION: Responsive Layout
  	
  	PURPOSE: Multi-column layout with non-standard alignments
  	(Ex: Bottom of titles need to line up)
  ************************************************************************/
  .coe-3-col .col-12 {
  	display: flex;
  	flex-wrap: wrap;
  	column-gap: 20px;
  	row-gap: 50px;
  	align-items: stretch;
  }

  .coe-3-col .coe-col-item {
  	width: calc(33% - 17px);
  }

  @media screen and (max-width: 991px) {
  	.coe-3-col .coe-col-item {
  		width: calc(50% - 10px);
  	}
  }

  @media screen and (max-width: 767px) {
  	.coe-3-col .coe-col-item {
  		width: 100%;
  	}
  }

  .bottom-align-title {
  	display: flex;
  	flex-direction: column-reverse;
  }

  /************************************************************************
  	SECTION: Bootstrap Gutter Y Extension
  	
  	PURPOSE: Boostrap default gutter y utility does not cover 100px
  ************************************************************************/
  .row.gy-100 {
    --bs-gutter-y: 100px !important;
  }
media: all
