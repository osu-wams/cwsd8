id: coe_brand_components_sidebars
label: 'COE Brand Components (Sidebars)'
code: |-
  const getMobileToggle = (classname) => {
  	return document.querySelector(`.${classname} .sidebar-mobile-toggle`);
  }

  const sideMobileToggle = (obj, classname) => {
    obj.classList.toggle("active");
    const content = document.getElementsByClassName(classname);
    Array.from(content).forEach((e) => {
      if (e.style.maxHeight) {
      	e.style.maxHeight = e.scrollHeight + "px";
      	e.style.overflow = "hidden";
        setTimeout(() => {e.style.maxHeight = null;}, 10);
      } else {
        e.style.maxHeight = e.scrollHeight + "px";
        setTimeout(() => {
        	e.style.maxHeight = "none";
  	      e.style.overflow = "unset";
        }, 500);
      }
    });
  }

  const sideDefaultOpen = (classname) => {
    const content = document.getElementsByClassName(classname);
     Array.from(content).forEach((e) => {
      e.style.maxHeight = e.scrollHeight + "px";
      setTimeout(() => {
      	e.style.maxHeight = "none";
        e.style.overflow = "unset";
      }, 500);
    });
  }

  const rfiOverview = getMobileToggle("rfi-overview-headline");
  const sideFaq = getMobileToggle("faq-headline");
  const sideHelpfulLinks = getMobileToggle("helpful-links-headline");

  const sideProgramDetails = getMobileToggle("program-details-headline");
  const sideNextSteps = getMobileToggle("next-steps-headline");
  const sideStayConnected = getMobileToggle("stay-connected-headline");


  if (sideHelpfulLinks && sideHelpfulLinks.classList.contains('active')) {
  	sideDefaultOpen('helpful-links-hidden-content');
  }
  if (sideProgramDetails && sideProgramDetails.classList.contains('active')) {
  	sideDefaultOpen('program-details-hidden-content');
  }
  if (sideNextSteps && sideNextSteps.classList.contains('active')) {
  	sideDefaultOpen('next-steps-hidden-content');
  }
  if (sideStayConnected && sideStayConnected.classList.contains('active')) {
  	sideDefaultOpen('stay-connected-hidden-content');
  }

  rfiOverview && rfiOverview.addEventListener("click", function () {sideMobileToggle(this, 'rfi-overview-hidden-content')});
  sideFaq && sideFaq.addEventListener("click", function () {sideMobileToggle(this, 'faq-hidden-content')});
  sideHelpfulLinks && sideHelpfulLinks.addEventListener("click", function () {sideMobileToggle(this, 'helpful-links-hidden-content')});

  sideProgramDetails && sideProgramDetails.addEventListener("click", function () {sideMobileToggle(this, 'program-details-hidden-content')})
  sideNextSteps && sideNextSteps.addEventListener("click", function () {sideMobileToggle(this, 'next-steps-hidden-content')})
  sideStayConnected && sideStayConnected.addEventListener("click", function () {sideMobileToggle(this, 'stay-connected-hidden-content')})


  // No tab selected by default on RFI page
  const activeRFITab = document.querySelector(".rfi-tabs .nav-link.active");
  const activeRFITabContent = document.querySelector(".rfi-tabs .tab-pane.active");
  activeRFITab && activeRFITab.classList.toggle("active");
  activeRFITabContent && activeRFITabContent.classList.toggle("active");

  console.log(activeRFITab);
