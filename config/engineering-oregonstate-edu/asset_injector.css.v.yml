label: 'COE Brand - Views Exposed Filters'
code: |
  .views-exposed-form .form--inline {
  	display: flex !important;
  	flex-wrap: wrap;
  	justify-content: space-between;
  	width: 100%;
  }

  .views-exposed-form .form--inline > .form-item {
  	flex: 0 0 calc(50% - 16px); /* 2 columns with spacing */
  	margin: 0 !important;
  }

  /* Mobile layout: one column */
  @media (max-width: 767px) {
  	.views-exposed-form .form--inline > .form-item {
  		flex: 0 0 100%;
  	}
  }

  .views-exposed-form .js-form-item select,
  .views-exposed-form .js-form-item input {
  	border-radius: 5px;
  	border: 2px solid var(--Primary-Paddletail-Black, #000);
  	height: 76px;
  	width: 100% !important; 
  	padding-left: 16px;
  	font-size: 18px;
  	transition: .3s;
  	margin: 0 !important;
  }

  .views-exposed-form .js-form-type-select select{
  	background-image: url(https://engineering.oregonstate.edu/sites/engineering.oregonstate.edu/files/2024-12/triangle-3.svg);
  	background-repeat: none !important;
  	background-size: 24px;
  	padding-right: 20px;
  	background-position: 98% 51%;
  	
  }

  .views-exposed-form .form--inline {
  	column-gap: 24px !important;
  	row-gap: 30px !important;
  }


  .views-exposed-form .js-form-item select:hover,
  .views-exposed-form .js-form-item input:hover,
  .views-exposed-form .js-form-item select:active,
  .views-exposed-form .js-form-item input:active,
  .views-exposed-form .js-form-item select:focus,
  .views-exposed-form .js-form-item input:focus{
  	border-radius: 5px !important;
  	background-color: #EAF5F6 !important;
  	border-color: #000 !important;
  }

  .views-exposed-form .js-form-item select:hover{
  	background-image: url(https://engineering.oregonstate.edu/sites/engineering.oregonstate.edu/files/2024-12/triangle-3.svg);
  	background-repeat: none !important;
  	background-size: 24px;
  	padding-right: 20px;
  	background-position: 98% 51%;
  }

  .views-exposed-form label.form-label {
  	color: var(--Primary-Paddletail-Black, #000);
  	/* Main/H6 */
  	font-family: "Open Sans";
  	font-size: 20px;
  	font-style: normal;
  	font-weight: 600;
  	line-height: 130%; /* 26px */
  	margin-bottom: 10px;
  }

  #edit-submit-engr-profile, #views-exposed-form-engr-profile-block-35 .button--primary,
  #views-exposed-form-engr-profile-block-11 .button--primary,
  #views-exposed-form-engr-profile-block-9 .button--primary,
  #views-exposed-form-engr-profile-block-10 .button--primary,
  #views-exposed-form-engr-profile-block-1 .button--primary,
  .views-exposed-form .button--primary {
  	width: 320px;
  	color: var(--Primary-Bucktooth-White, #FFF);
  	text-align: center;
  	font-family: "Open Sans";
  	font-size: 20px;
  	font-style: normal;
  	font-weight: 600;
  	line-height: normal;
  	letter-spacing: 1px;
  	text-transform: uppercase;
  	background: #000 !important;
  	border: 2px solid #000 !important;
  	padding-top: 17px;
  	padding-bottom: 16px;
  	transition: .3s ease;
  	margin-bottom: 0 !important;
  }

  #edit-submit-engr-profile:hover,
  #views-exposed-form-engr-profile-block-11 .button--primary:hover,
  #views-exposed-form-engr-profile-block-9 .button--primary:hover,
  #views-exposed-form-engr-profile-block-10 .button--primary:hover,
  #views-exposed-form-engr-profile-block-1 .button--primary:hover,
  .views-exposed-form .button--primary:hover{
  	width: 320px;
  	color: #000 !important;
  	background: #fff !important;
  	border: 2px solid #000 !important;
  }

  .coe-brand-story-filters .js-form-item-combine {
  	flex: 0 0 100% !important;
  	max-width: 100% !important;
  }

  #edit-reset-engr-profile, #views-exposed-form-engr-profile-block-35 .osu-btn-light,
  #edit-reset-engr-stories .osu-btn-light,
  #views-exposed-form-engr-profile-block-11 .osu-btn-light,
  #views-exposed-form-engr-profile-block-9 .osu-btn-light,
  #views-exposed-form-engr-profile-block-10 .osu-btn-light,
  #views-exposed-form-engr-profile-block-1 .osu-btn-light,
  #views-exposed-form-engr-facilities-block-3 .osu-btn-light,
  .views-exposed-form .osu-btn-light{
  	border: 2px solid var(--Primary-Paddletail-Black, #000) !important;
  	background: var(--Primary-Bucktooth-White, #FFF) !important;
  	color: #000 !important;
  	width: 320px;
  	text-align: center;
  	font-family: "Open Sans";
  	font-size: 20px;
  	font-style: normal;
  	font-weight: 600;
  	line-height: normal;
  	letter-spacing: 1px;
  	text-transform: uppercase;
  	padding-top: 17px;
  	padding-bottom: 16px;
  	transition: .3s ease;
  	border-radius: 0;
  	margin-bottom: 0 !important;
  }

  #edit-reset-engr-profile:hover,
  #edit-reset-engr-stories:hover,
  #views-exposed-form-engr-profile-block-11 .osu-btn-light:hover,
  #views-exposed-form-engr-profile-block-9 .osu-btn-light:hover,
  #views-exposed-form-engr-profile-block-10 .osu-btn-light:hover,
  #views-exposed-form-engr-profile-block-1 .osu-btn-light:hover,
  #views-exposed-form-engr-facilities-block-3 .osu-btn-light:hover,
  .views-exposed-form .osu-btn-light:hover{ 
  	border: 2px solid var(--Primary-Paddletail-Black, #000) !important;
  	background: #000 !important;
  	color: #FFF !important;
  	
  }

  @media only screen and (min-width: 767px) {
  	#edit-reset-engr-profile, #views-exposed-form-engr-profile-block-35 .osu-btn-light,
  	#views-exposed-form-engr-profile-block-11 .osu-btn-light,
  	#views-exposed-form-engr-profile-block-9 .osu-btn-light,
  	#views-exposed-form-engr-facilities-block-3 .osu-btn-light{
  		margin-left: 20px;
  	}

  }

  @media only screen and (max-width: 1199px) {
  	#edit-reset-engr-profile, #views-exposed-form-engr-profile-block-35 .osu-btn-light,
  	#views-exposed-form-engr-profile-block-11 .osu-btn-light,
  	#views-exposed-form-engr-profile-block-9 .osu-btn-light,
  	#views-exposed-form-engr-facilities-block-3 .osu-btn-light
  	{
  		width: 99%;
  	}
  }

  .gap-2{
  	row-gap: 30px !important;
  	column-gap: 24px !important;
  }

  .views-exposed-form {
  	border-bottom: 1px solid #C6DAE7;
  	margin-bottom: 30px;
  }

  /* --- Force action buttons to their own row --- */
  .views-exposed-form .form-actions {
  	flex: 0 0 100%; /* new line */
  	display: flex;
    flex-direction: row;
  	justify-content: flex-start;
  	align-items: center;
  	flex-wrap: wrap;
  	margin-bottom: 20px !important;
  	gap: 20px;
  	margin-top: 20px;
  }

  .views-exposed-form .form-actions input {
  	font-family: "Open Sans";
  	font-weight: 400;
  	text-transform: uppercase;
  	font-size: 20px;
  	color: #FFF !important;
  	/* 0 top margin for all buttons */
  	margin-top: 0 !important;
  	/* Fixed 320px width for all buttons */
  	width: 320px !important;
  	display: inline-block;
  }

  /* for Clear filter, since the button is while, text should be black */
  .views-exposed-form .form-actions #edit-reset-engr-stories {
    color: #000 !important;
  }

  .views-exposed-form .form-actions #edit-reset-engr-stories:hover,
  .views-exposed-form .form-actions #edit-reset-engr-stories:active {
    color: #FFF !important;
  }

  /* Ensure consistent ordering: Search left, Clear Filters right */
  .views-exposed-form .form-actions input[type="submit"]:first-child {
  	order: 1;
  }
  .views-exposed-form .form-actions input[name="reset"] {
  	order: 2;
  }

  /* Mobile Layout */
  @media (max-width: 767px) {
  	/* Stack vertically on mobile */
  	.views-exposed-form .form-actions {
  		flex-direction: column;
  		align-items: stretch;
  		gap: 12px;    
  	}

  	/* full width on mobile */
  	.views-exposed-form .form-actions input {
  		width: 100% !important;
  	}
  }
