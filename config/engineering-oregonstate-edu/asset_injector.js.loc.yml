label: 'Localist Cards'
code: |-
  (function () {
  	'use strict';
  	
  	// Hide the date row in event specs when the date is missing or empty.
  	function hideEmptyDates(root) {
  	  root.querySelectorAll('.osu-event-specs').forEach((dl) => {
  	    const timeEl = dl.querySelector('dd.osu-event-date time');
  	    if (timeEl && timeEl.textContent.trim()) return;
  	
  	    const dt = dl.querySelector('dt.osu-event-date');
  	    const dd = dl.querySelector('dd.osu-event-date');
  	    if (dt) dt.style.display = 'none';
  	    if (dd) dd.style.display = 'none';
  	  });
  	}
  	
  	// Change card title headings from h2 to the level set in data-heading-level.
  	function getHeadingLevel(wrapper) {
  	  const level = parseInt(wrapper.getAttribute('data-heading-level'), 10);
  	  return level >= 3 && level <= 6 ? level : null; // h2 is the template default
  	}
  	
  	function swapHeadings(wrapper, level) {
  	  wrapper.querySelectorAll('h2.osu-card-title').forEach((h) => {
  	    const n = document.createElement('h' + level);
  	    for (const attr of h.attributes) n.setAttribute(attr.name, attr.value);
  	    n.append(...h.childNodes);
  	    h.replaceWith(n);
  	  });
  	}
  	
  	function init() {
  	  // Event specs rendered outside a widget.
  	  hideEmptyDates(document);
  	
  	  // Widgets render asynchronously, so apply the fixes now and whenever content arrives.
  	  document.querySelectorAll('.localist-widget').forEach((wrapper) => {
  	    const level = getHeadingLevel(wrapper);
  	
  	    const run = () => {
  	      hideEmptyDates(wrapper);
  	      if (level) swapHeadings(wrapper, level);
  	    };
  	
  	    run();
  	    new MutationObserver(run).observe(wrapper, { childList: true, subtree: true });
  	  });
  	}
  	
  	if (document.readyState === 'loading') {
  	  document.addEventListener('DOMContentLoaded', init);
  	} else {
  	  init();
  	}
  })();
