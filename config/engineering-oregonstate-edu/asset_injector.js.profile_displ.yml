id: profile_displ
label: 'Semantic List Field Replacement'
code: |-
  function convertToList(selector, itemSelector, { ordered = false, preserveClasses = false } = {}) {
  	const tag = ordered ? 'ol' : 'ul';

  	document.querySelectorAll(selector).forEach(field => {
  		const items = field.querySelectorAll(itemSelector);
  		if (!items.length) return;

  		const list = document.createElement(tag);
  		const fragment = document.createDocumentFragment();

  		items.forEach(item => {
  			const li = document.createElement('li');
  			if (preserveClasses) li.className = item.className;
  			li.innerHTML = item.innerHTML;
  			fragment.appendChild(li);
  		});

  		list.appendChild(fragment);
  		field.replaceChildren(list);
  	});
  }

  /*===========================================================================
  	Using This Injector
  	
  	1) Add a line below with your relevant selector(s).
  	2) Add your page condition to the restricted pages list.
  ============================================================================*/
  convertToList('.field--name-field-c-engr-degrees', '.field__item');
  convertToList('.field--name-field-engr-osa-degrees', '.field__item');
