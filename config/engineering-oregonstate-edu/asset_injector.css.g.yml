label: 'COE Brand - Base Styling (GLOBAL)'
code: |-
  /*==================================================================================================================================
  	Background Colors Section

  	USAGE:
  		Full color: class="coe-bg-star-canvas"
  		Tint: class="coe-bg-star-canvas bg-opacity-20"

  	This closely matches the Bootstrap 5.3 color system, which uses CSS variables to define colors and opacity.
  	The only difference being that these are FLAT colors (mixed with white).
  	https://getbootstrap.com/docs/5.3/utilities/background/
  ==================================================================================================================================*/

  /*====================================================================================
  	Palette
  ====================================================================================*/

  :root {
  	--Secondary-Pine-Stand: #4A773C;
  	--Secondary-High-Tide: #00859B;
  	--Secondary-Luminance: #FFB500;
  	--Secondary-Stratosphere: #006A8E;
  	--Secondary-Reindeer-Moss: #C4D6A4;
  	--Secondary-Seafoam: #B8DDE1;
  	--Secondary-Candela: #FDD26E;
  	--Secondary-Moondust: #C6DAE7;
  	--Secondary-Hop-Bine: #AA9D2E;
  	--Secondary-Rogue-Wave: #0D5257;
  	--Secondary-Solar-Flare: #D3832B;
  	--Secondary-Star-Canvas: #003B5C;
  	--Secondary-Till: #B7A99A;
  	--Secondary-Coastline: #A7ACA2;
  	--Secondary-High-Desert: #7A6855;
  	--Secondary-Crater: #8E9089;
  }

  /*====================================================================================
  	Background Colors
  ====================================================================================*/

  .coe-bg-pine-stand { --coe-bg-color: var(--Secondary-Pine-Stand); }
  .coe-bg-high-tide { --coe-bg-color: var(--Secondary-High-Tide); }
  .coe-bg-luminance { --coe-bg-color: var(--Secondary-Luminance); }
  .coe-bg-stratosphere { --coe-bg-color: var(--Secondary-Stratosphere); }
  .coe-bg-reindeer-moss { --coe-bg-color: var(--Secondary-Reindeer-Moss); }
  .coe-bg-seafoam { --coe-bg-color: var(--Secondary-Seafoam); }
  .coe-bg-candela { --coe-bg-color: var(--Secondary-Candela); }
  .coe-bg-moondust { --coe-bg-color: var(--Secondary-Moondust); }
  .coe-bg-hop-bine { --coe-bg-color: var(--Secondary-Hop-Bine); }
  .coe-bg-rogue-wave { --coe-bg-color: var(--Secondary-Rogue-Wave); }
  .coe-bg-solar-flare { --coe-bg-color: var(--Secondary-Solar-Flare); }
  .coe-bg-star-canvas { --coe-bg-color: var(--Secondary-Star-Canvas); }
  .coe-bg-till { --coe-bg-color: var(--Secondary-Till); }
  .coe-bg-coastline { --coe-bg-color: var(--Secondary-Coastline); }
  .coe-bg-high-desert { --coe-bg-color: var(--Secondary-High-Desert); }
  .coe-bg-crater { --coe-bg-color: var(--Secondary-Crater); }

  .coe-bg-pine-stand,
  .coe-bg-high-tide,
  .coe-bg-luminance,
  .coe-bg-stratosphere,
  .coe-bg-reindeer-moss,
  .coe-bg-seafoam,
  .coe-bg-candela,
  .coe-bg-moondust,
  .coe-bg-hop-bine,
  .coe-bg-rogue-wave,
  .coe-bg-solar-flare,
  .coe-bg-star-canvas,
  .coe-bg-till,
  .coe-bg-coastline,
  .coe-bg-high-desert,
  .coe-bg-crater {
  	--bs-bg-opacity: 1;
  	background-color: color-mix(in srgb, var(--coe-bg-color) calc(var(--bs-bg-opacity) * 100%), white) !important;
  }

  /*=====================================================================================
  	Tint / Opacity
  =====================================================================================*/

  .bg-opacity-10 { --bs-bg-opacity: 0.1; }
  .bg-opacity-15 { --bs-bg-opacity: 0.15; }
  .bg-opacity-20 { --bs-bg-opacity: 0.2; }
  .bg-opacity-25 { --bs-bg-opacity: 0.25; }
  .bg-opacity-30 { --bs-bg-opacity: 0.3; }
  .bg-opacity-50 { --bs-bg-opacity: 0.5; }
  .bg-opacity-75 { --bs-bg-opacity: 0.75; }
  .bg-opacity-100 { --bs-bg-opacity: 1; }


  /*==================================================================================================================================
  	Main Section
  ==================================================================================================================================*/

  /************************************************************************
  	SECTION: Image Box Shadow Color
  	
  	PURPOSE: Applies a box shadow color to images
  	
  	INSTRUCTIONS:
  		1. Insert class name (ex. img-bottom-left-hop-bine) into block 
  		2. Configure > Manage Attributes > Block content attributes
  ************************************************************************/

  /** Right Bottom **/
  .img-bottom-right-yellow .field__item img {
  	box-shadow: 15px 15px 0 #FFB500;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }
  .img-bottom-right-orange .field__item img {
  	box-shadow: 15px 15px 0 #d73f09;
  	margin-bottom: 25px;
  }
  .img-bottom-right-seafoam .field__item img {
  	box-shadow: 15px 15px 0 #B8DDE1;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }
  .img-bottom-right-hop-bine .field__item img {
  	box-shadow: 15px 15px 0 #AA9D2E;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }
  .img-bottom-right-blue .field__item img,
  .img-bottom-right-hightide .field__item img{
  	box-shadow: 15px 15px 0 #00859B;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }
  .img-bottom-right-pine-stand .field__item img {
  	box-shadow: 15px 15px 0 #4A773C;
  	margin-bottom: 25px;
  }
  .img-bottom-right-solar-flare .field__item img {
  	box-shadow: 15px 15px 0 #D3832B;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }
  .img-bottom-right-rogue-wave .field__item img {
  	box-shadow: 15px 15px 0 #0D5257;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }
  .img-bottom-right-candela .field__item img {
  	box-shadow: 15px 15px 0 #FDD26E;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }	
  .img-bottom-right-luminance .field__item img {
  	box-shadow: 15px 15px 0 #FFB500;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }

  /** Left Bottom **/
  .img-bottom-left-yellow .field__item img {
  	box-shadow: -15px 15px 0 #FFB500;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  	margin-left: 15px;
  }
  .img-bottom-left-orange .field__item img {
  	box-shadow: -15px 15px 0 #d73f09;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  	margin-left: 15px;
  }
  .img-bottom-left-seafoam .field__item img {
  	box-shadow: -15px 15px 0 #B8DDE1;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  	margin-left: 15px;
  }
  .img-bottom-left-hop-bine .field__item img {
    box-shadow: -15px 15px 0 #AA9D2E;
    margin-bottom: 25px;
    width: calc(100% - 15px);
    margin-left: 15px;
  }
  .img-bottom-left-hightide .field__item img,
  .img-bottom-left-blue .field__item img {
  	box-shadow: -15px 15px 0 #00859B;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  	margin-left: 15px;
  }
  .img-bottom-left-pine-stand .field__item img {
  	box-shadow: -15px 15px 0 #4A773C;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  	margin-left: 15px;
  }
  .img-bottom-left-luminance .field__item img {
  	box-shadow: -15px 15px 0 #ffb500;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  	margin-left: 15px;
  }
  .img-bottom-left-solar-flare .field__item img {
  	box-shadow: -15px 15px 0 #D3832B;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  	margin-left: 15px;
  }
  .img-bottom-left-stratosphere .field__item img {
  	box-shadow: -15px 15px 0 #006A8E;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  	margin-left: 15px;
  }
  .img-bottom-left-rogue-wave .field__item img {
  	box-shadow: -15px 15px 0 #0D5257;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  	margin-left: 15px;
  }
  .img-bottom-left-high-tide .field__item img {
  	box-shadow: -15px 15px 0 #00859B;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  	margin-left: 15px;
  }
  .img-bottom-left-candela .field__item img {
  	box-shadow: -15px 15px 0 #FDD26E;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  	margin-left: 15px;
  }

  /** Right Top **/
  .img-top-right-green .field__item img {
  	box-shadow: 15px -15px 0 #4A773C;
  	margin-top: 25px;
  }
  .img-top-right-hop-bine .field__item img {
  	box-shadow: 15px -15px 0 #AA9D2E;
  	margin-top: 25px;
  }

  /** Left Top **/
  .img-top-left-yellow .field__item img {
  	box-shadow: -15px -15px 0 #FFB500;
  	margin-top: 25px;
  }
  .img-top-left-orange .field__item img {
  	box-shadow: -15px -15px 0 #d73f09;
  	margin-top: 25px;
  }

  /*=====================================
  	COE Brand Buttons
  ======================================*/
  a.black-border, a.black-fill, a.orange-border, a.orange-fill, a.yellow-fill, a.yellow-border, a.white-border, a.white-fill, a.seafoam-border,
  .black-border a, .black-fill a, .orange-border a, .orange-fill a, .yellow-fill a, .yellow-border a, .white-border a, .white-fill a, .seafoam-border a,
  .paragraph--type--coe-article-conclusion .field--name-field-coe-conclusion-link a {
  	text-align: center;
  	font-family: "Open Sans";
  	font-size: 18px;
  	font-style: normal;
  	font-weight: 600;
  	line-height: normal;
  	letter-spacing: 0.9px;
  	text-transform: uppercase;
  	padding: 17px 10px;
  	transition: 0.3s;
  	display: block;
  	margin-top: 20px;
  	display: flex;
  	justify-content: center;
  	align-items: center;
  	text-decoration: none;
  }

  a.black-border:not([class$="-width"]),
  a.black-fill:not([class$="-width"]),
  a.orange-border:not([class$="-width"]),
  a.orange-fill:not([class$="-width"]),
  a.yellow-fill:not([class$="-width"]),
  a.yellow-border:not([class$="-width"]),
  a.white-border:not([class$="-width"]),
  a.white-fill:not([class$="-width"]),
  a.seafoam-border:not([class$="-width"]),
  .black-border a:not([class$="-width"]),
  .black-fill a:not([class$="-width"]),
  .orange-border a:not([class$="-width"]),
  .orange-fill a:not([class$="-width"]),
  .yellow-fill a:not([class$="-width"]),
  .yellow-border a:not([class$="-width"]),
  .white-border a:not([class$="-width"]),
  .white-fill a:not([class$="-width"]),
  .seafoam-border a:not([class$="-width"]),
  .paragraph--type--coe-article-conclusion .field--name-field-coe-conclusion-link a:not([class$="-width"]) {
    min-width: 320px;
  	width: max-content;
  }

  @media screen and (max-width: 767px) {
  	a.black-border, a.black-fill, a.orange-border, a.orange-fill, a.yellow-fill, a.yellow-border, a.white-border, a.white-fill, a.seafoam-border,
  .black-border a, .black-fill a, .orange-border a, .orange-fill a, .yellow-fill a, .yellow-border a, .white-border a, .white-fill a, .seafoam-border a,
  .paragraph--type--coe-article-conclusion .field--name-field-coe-conclusion-link a,
  a.black-border:not([class$="-width"]),
  a.black-fill:not([class$="-width"]),
  a.orange-border:not([class$="-width"]),
  a.orange-fill:not([class$="-width"]),
  a.yellow-fill:not([class$="-width"]),
  a.yellow-border:not([class$="-width"]),
  a.white-border:not([class$="-width"]),
  a.white-fill:not([class$="-width"]),
  a.seafoam-border:not([class$="-width"]),
  .black-border a:not([class$="-width"]),
  .black-fill a:not([class$="-width"]),
  .orange-border a:not([class$="-width"]),
  .orange-fill a:not([class$="-width"]),
  .yellow-fill a:not([class$="-width"]),
  .yellow-border a:not([class$="-width"]),
  .white-border a:not([class$="-width"]),
  .white-fill a:not([class$="-width"]),
  .seafoam-border a:not([class$="-width"]),
  .paragraph--type--coe-article-conclusion .field--name-field-coe-conclusion-link a:not([class$="-width"]) {
  	width: 100%;
  	min-width: 0;
  }
  }

  a.black-border, a.black-fill,
  a.black-border:hover, a.black-fill:hover,
  .black-border a, .black-fill a,
  .black-border a:hover, .black-fill a:hover {
  	border: 2px solid #000;
  }

  a.orange-border, a.orange-fill,
  a.orange-border:hover, a.orange-fill:hover,
  .orange-border a, .orange-fill a,
  .orange-border a:hover, .orange-fill a:hover {
  	border: 2px solid #D73F09;
  }

  a.yellow-fill, a.yellow-fill:hover, a.yellow-border,
  .yellow-fill a, .yellow-fill a:hover, .yellow-border a,
  .paragraph--type--coe-article-conclusion .field--name-field-coe-conclusion-link a, .paragraph--type--coe-article-conclusion .field--name-field-coe-conclusion-link a:hover {
  	border: 2px solid #FFB500;
  }

  a.seafoam-border, .seafoam-border a {
  	color: var(--Secondary-Seafoam, #B8DDE1) !important;
  	border: 2px solid var(--Secondary-Seafoam, #B8DDE1);
  }

  a.yellow-border:active,
  .yellow-border a:active {
  	background-color: #D3832B !important;
    border: 2px solid #D3832B !important;
    color: #000 !important;
  }

  a.yellow-fill, a.yellow-border:hover, a.yellow-border:focus,
  .yellow-fill a, .yellow-border a:hover, .yellow-border a:focus,
  .paragraph--type--coe-article-conclusion .field--name-field-coe-conclusion-link a {
  	background-color: #FFB500;
  	color: #000;
  	border: 2px solid #FFB500;
  }

  a.white-border, a.white-fill:hover, a.white-fill:focus,
  .white-border a, .white-fill a:hover, .white-fill a:focus {
    background-color: var(--transparent-bg-color, transparent);
    color: #FFF !important;
  }

  a.white-border, a.white-fill, a.white-border:hover, a.white-fill:hover,
  .white-border a, .white-fill a, .white-border a:hover, .white-fill a:hover {
    border: 2px solid #FFF;
  }

  a.white-fill, a.white-border:hover, a.white-border:focus,
  .white-fill a, .white-border a:hover, .white-border a:focus {
    background-color: #FFF;
    color: #000 !important;
    border-bottom: 2px solid #FFF;
  }

  a.white-border:active, .white-border a:active {
  	background-color: #F8F9FA !important;
  	color: #000 !important;
  	border: 2px solid #F8F9FA;
  }

  a.white-fill:active, .white-fill a:active {
  	color: #F8F9FA !important;
  	border: 2px solid #F8F9FA;
  }


  a.black-border,
  a.black-fill:hover, a.black-fill:focus,
  .black-border a,
  .black-fill a:hover, .black-fill a:focus {
  	background-color: var(--transparent-bg-color, transparent);
  	color: #000;
  	border-bottom: 2px solid #000; /* cancel out main a styling */
  } 

  a.yellow-fill:hover, a.yellow-fill:focus,
  .yellow-fill a:hover, .yellow-fill a:focus,
  .paragraph--type--coe-article-conclusion .field--name-field-coe-conclusion-link a:hover, .paragraph--type--coe-article-conclusion .field--name-field-coe-conclusion-link a:focus {
  	background-color: var(--transparent-bg-color, transparent);
  	color: #FFB500;
  	border-bottom: 2px solid #FFB500; /* cancel out main a styling */
  }
  a.orange-border,
  a.orange-fill:hover, a.orange-fill:focus,
  .orange-border a,
  .orange-fill a:hover, .orange-fill a:focus {
  	background-color: var(--transparent-bg-color, transparent);
  	color: #D73F09;
  	border-bottom: 2px solid #D73F09; /* cancel out main a styling */
  }

  a.black-fill,
  a.black-border:hover, a.black-border:focus,
  .black-fill a,
  .black-border a:hover, .black-border a:focus {
  	background-color: #000;
  	color: #FFF;
  	border-bottom: 2px solid #000; /* cancel out main a styling */
  }

  a.orange-fill,
  a.orange-border:hover, a.orange-border:focus,
  .orange-fill a,
  .orange-border a:hover, .orange-border a:focus {
  	background-color: #D73F09;
  	color: #FFF;
  }

  a.seafoam-border:hover,
  .seafoam-border a:hover,
  a.seafoam-border:focus,
  .seafoam-border a:focus {
  	background-color: var(--Secondary-Seafoam, #B8DDE1);
  	color: var(--Secondary-Rogue-Wave, #0D5257) !important;
  	border-bottom: 2px solid var(--Secondary-Seafoam, #B8DDE1); /* cancel out main a styling */
  }

  a.black-border:active,
  .black-border a:active {
  	background-color: #212529 !important;
  	color: #FFF !important;
  	border: 2px solid #212529 !important;
  }

  a.black-fill:active,
  .black-fill a:active {
  	background-color: var(--transparent-bg-color, transparent) !important;
  	color: #212529 !important;
  	border: 2px solid #212529;
  }

  a.orange-border:active,
  .orange-border a:active {
  	background-color: #BE3706 !important;
  	color: #FFF !important;
  	border: 2px solid #BE3706;
  }

  a.orange-fill:active,
  .orange-fill a:active {
  	background-color: inherit !important;
  	color: #BE3706 !important;
  	border: 2px solid #BE3706;
  }

  a.yellow-border,
  .yellow-border a {
  	background-color: var(--transparent-bg-color, transparent);
  	color: #FFB500;
  }

  a.yellow-fill:active,
  .yellow-fill a:active {
  	background-color: var(--transparent-bg-color, transparent) !important;
  	color: #D3832B !important;
  	border: 2px solid #D3832B !important;
  }

  a.seafoam-border:active,
  .seafoam-border a:active {
  	border: 2px solid var(--Useful-Seafoam-Shades-Seafoam-Active, #ACCBCF);
    background-color: var(--Useful-Seafoam-Shades-Seafoam-Active, #ACCBCF) !important;
    color: var(--Secondary-Rogue-Wave, #0D5257) !important;
  }


  /*==================================================================================================================================
  	Fixes Section
  ==================================================================================================================================*/

  /*=====================================
  	Caption fix for a bug from Central
  	(they meant for it to show up below, but they added paranthesis to "bottom", making it invalid, and defaulting to top)
  ======================================*/
  figcaption.osu-caption-bottom {
  	caption-side: bottom !important;
  }
