id: legacy_blocks
label: 'LEGACY Blocks'
code: |-
  /* ================================================
   Past event cards.
  ================================================ */

  .past-event-card {
    display: flex;
    flex-direction: row;
  }

  .past-event-card .event-card-image {
    flex: 0 0 25%;
    aspect-ratio: 1/1;
  }

  .past-event-card .event-card-image .media,
  .past-event-card .event-card-image .field {
    height: 100%;
  }

  .past-event-card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 25%;
  }

  .past-event-card .event-card-body {
    flex: 1;
    min-width: 0;
    padding: 30px;
  }

  .past-event-card .card-title {
    margin-top: 0;
    color: #d73f09;
    font-family: 'Open Sans';
    font-size: 20px;
    font-style: normal;
    font-weight: 600;
    line-height: 130%;
    text-transform: none;
  }

  .past-event-card .card-title a {
    color: inherit;
    font-family: inherit;
    font-size: inherit;
    font-style: inherit;
    font-weight: inherit;
    line-height: inherit;
  }

  .past-event-card .event-card-body > * {
    margin-bottom: 0.5rem;
  }

  .past-event-card .event-card-body > :last-child {
    margin-bottom: 0;
  }

  @media screen and (max-width: 1199px) {
    .past-event-card .event-card-image {
      flex-basis: 35%;
    }
  }

  @media screen and (max-width: 991px) {
    .past-event-card .event-card-image {
      flex-basis: 30%;
    }

    .past-event-card .event-card-body {
      padding: 20px;
    }
  }

  @media screen and (max-width: 767px) {
    .past-event-card {
      flex-direction: column;
    }

    .past-event-card .event-card-image {
      flex: 0 0 auto;
      aspect-ratio: 16/9;
    }
  }

  /* ================================================
  Styling for Engr Nav Card content block
  =================================================== */

  .block-inline-blockengineering-card {
  	position: relative;
    font-size: 1.2rem;
  }

  /* Blow up card on hover */

  .block-inline-blockengineering-card:hover {
  	transform: scale(1.10);
    transition: transform .5s ease;
  }

  .block-inline-blockengineering-card .block-field-blockblock-contentengineering-cardfield-osu-card-link a::before {
  	content: '';
    position: absolute;
    inset: 0;
  }

  /** Image to Edge **/

  .block-inline-blockengineering-card,
  .block-inline-blockengineering-card .block__content > div:first-child, 
  .block-inline-blockengineering-card .block__content > div:first-child > div > div > div{
  	padding: 0 !important;
  }
  .block-inline-blockengineering-card .block__content .img-fluid {
  	width: 100%;
  }
  .block-inline-blockengineering-card .block-field-blockblock-contentengineering-cardfield-osu-card-link {
  	padding-left: 1rem;
  	padding-right: 1rem;
  	
  }

  /** Hide Images in mobile **/

  @media (max-width: 540px) {
  	.block-inline-blockengineering-card .field--name-field-osu-card-image {
  		display: none;
  	}
  	.block-inline-blockengineering-card a {
  		display: block;
  		padding: .5rem 1rem;
  		
  	}
  }

  /**Nav card font size**/
  .block-inline-blockengineering-card a{
  	font-size: 1.2rem;
  }

  /*==============================================================================
  	OSA Image Text Cards
  ==============================================================================*/
  .osa-image-text-cards img {
  	border-top-left-radius: 5px;
  	border-top-right-radius: 5px;
  	overflow: hidden;
  	display: block;
  }

  .osa-image-text-cards {
  	position: relative;
  	border: 2px solid transparent;
  	box-sizing: border-box;
  }

  .osa-image-text-cards:hover {
  	border: 2px solid #F8F9FA;
  	background-color: #F9FCFD !important;
  	transition: .3s;
  	box-shadow: 0px 1px 3px 0px rgba(0, 0, 0, 0.08) !important;
  }

  .osa-image-text-cards:focus {
  	background-color: #F9FCFD;
  	border: 2px solid #D73F09;
  	box-shadow: 0px 1px 3px 0px rgba(0, 0, 0, 0.08) !important;
  }

  .osa-image-text-cards:active {
  	background-color: #F9FCFD;
  	border: 2px solid #F8F9FA;
  	box-shadow: 0px 1px 3px 0px rgba(0, 0, 0, 0.08) !important;
  }

  .osa-image-text-cards a:focus {
  	background-color: #F9FCFD !important;
  	color: #000 !important;
  }

  .osa-image-text-cards a:hover {
  	background-color: #F9FCFD !important;
  	color: #000 !important;
  }

  .osa-image-text-cards a:active {
  	background-color: #F9FCFD !important;
  	color: #000 !important;
  }

  .osa-image-text-cards a {
  	background-color: #FFF !important;
  	color: #000 !important;
  }


  /*==============================================================================
  	Legacy Accordion
  	============================================================================*/
  .accordion-body{
  	background-color: white;
  }

  .accordion {
  	padding-bottom: 1.5rem;
  }


  /*==============================================================================
  	Legacy Past Event Cards
  	============================================================================*/
  .event-card-body time:nth-child(even) {
    display: none;
  }


  /*==============================================================================
  	Legacy Horizontal Profile Cards
  	============================================================================*/

  /* Set profile img size */
  .profile-img--horizontal img {
  	max-width: 125px !important;
  }

  /* Override img and card size for desktop */
  @media screen and (min-width: 1180px) {
  	.profile-img--horizontal img {
  		max-width: 200px !important;
    }
  	.horizontal-card-height{
  		height: 175px;
  		width: 620px;
  	}
  }

  @media screen and (max-width: 480px) {
  		.profile-img--horizontal img {
  		max-width: 200px !important;
  		height: 175px;
    }
  }

  /* Phone margin customization */
  .phone-margin{
  	margin-top: -15px;
  }

  @media screen and (max-width: 675px) {
  	.phone-margin {
  		margin-top: -15px;
  	}
  }

  .more-link {
    margin: 7px;
    font-weight: bold;
  }



  /* ==========================================================================
     Statistics styling
  ============================================================================= */

  /* Background, margin, text alignment */

  .coe-statistics .views-field-nothing {
  	background: #ccc;
  	padding: 15px;
  	text-align: center;
  }

  .coe-statistics .views-field-nothing p {
  	margin-bottom: 0;
  }

  .coe-statistics .views-field-nothing .fa-7x {
  	font-size: 4em;
  }

  /* Typography for h4 (likely deprecated by the description typography) */

  .coe-statistics .views-field-nothing h4 {
  	font-family: "Open Sans", sans-serif !important;
  	font-size: 1.25rem;
  	font-weight: 400;
  }

  /* Typography for description */

  .coe-statistics .coe-stat-description {
  	color: var(--bs-heading-color);
  	font-family: "Open Sans", sans-serif !important;
  	font-size: 1.25rem;
  	font-style: normal;
  	font-weight: 400;
  	line-height: 120%;
  	text-transform: none;
  }

  /* Typography for graph */

  .coe-statistics .display-1 {
  	font-family: "Open Sans", sans-serif !important;
  	font-size: 3em;
  	font-weight: 300;
  	padding: 0;
  }

  .coe-statistics .display-2 {
  	color: var(--bs-heading-color);
  	font-family: Stratum2Web;
  	font-size: 36px;
  	font-style: normal;
  	font-weight: 600;
  	line-height: 120%;
  	text-transform: none;
  }

  /* Small font for large numbers: Use class "coe-small-stat" on the number node as a class to add this styling */

  .coe-statistics .coe-small-stat.display-1 {
  	font-size: 3.5em;
  	padding: 20px 0;
  }

  .coe-statistics .views-field-nothing,
  .coe-statistics .field-content,
  .coe-statistics .statistic-view-block {
  	height: 100%;
  }

  .coe-statistics.col-12:nth-child(even) .views-field-nothing {
  	background: #ddd;
  	clip-path: polygon(calc(100% - 55px) 0,100% 65px,100% 100%,0 100%,0 0);
  }

  /* Remove padding and change font size */
  @media (min-width: 992px) and (max-width: 1399px) {
  	.coe-statistics:first-child,
  	.coe-statistics + .coe-statistics {
  		padding-left: 0 !important;
  	}
  	.coe-statistics:last-child {
  		padding-right: 0 !important;
  	}
  	.coe-statistics .display-1 {
  		font-size: 3em
  	}
  	
  	.coe-statistics .coe-small-stat.display-1 {
  		font-size: 2em;
  	}
  }

  /* Dark Background Styles*/
  .osu-bg-page-alt-2 .coe-statistics .views-field-nothing {
  	background: #333;
  }

  .osu-bg-page-alt-2 .coe-statistics .views-field-nothing .primary { /* icon */
  	color: #fff;	
  }

  .osu-bg-page-alt-2 .coe-statistics.col-12:nth-child(even) .views-field-nothing {
  	background: #555;
  }

  .osu-bg-page-alt-2 .coe-statistics .display-1
  .osu-bg-page-alt-2 .coe-statistics .display-2{
    text-shadow: none;
  }


  /*================================================================================================================================================================
  	SECTION: TOC Module Block Styling
  	
  	PURPOSE: Style the Toc.js module block
  	==============================================================================================================================================================*/

  /* equalize title height with the main body on the right */

  .toc-title {
  	padding-top: 8px;
  	font-size: 36px;
  }

  .toc-title,
  span[id^="toc"] + h2,
  span[id^="toc"] + h3 {
  	border-bottom: 6px solid #000;
  }

  /* typography for h3 */

  span[id^="toc"] + h3 {
  		color: #000;
  		font-family: "Stratum2Web", serif;
      font-weight: 600;
      font-size: 2.25rem;
      padding-top: 6px;
  }

  /** secondary items **/

  .toc-h2 {
  	margin-left: 0;
  	border-bottom: 1px solid #8E9089;
  }

  /** text shadow used so bold does not drop it to a second line **/

  .toc-js a {
    text-decoration: none;
    padding: .6rem .4rem;
    transition: background-color 0.4s ease;
    display: block;
  }

  .toc-js ul {
  	list-style-type: none;
  }

  .toc-js ul li {
  	padding-inline: 0; 
  	padding-block: .8rem;
  }

  /** text shadow used so bold does not drop it to a second line **/

  .toc-js ul li.toc-active a {
  		color: #000;
  		background: rgba(198, 218, 231, 0.3);
  }

  .toc-js ul li.toc-active,
  .toc-js a:active:not(.button, #osu-logo-wide, #osu-logo-crest) {
  	background-color: transparent;
  	color: #000;
  }
  	
  .h2.toc-title {
  	color: #000;
  	
  	/* H3 */
  	font-family: Stratum2Web;
  	font-size: 36px;
  	font-style: normal;
  	font-weight: 900;
  	line-height: 130%; /* 46.8px */
  	margin-bottom: 24px;
  }

  ul > .toc-h3, ul > .toc-h2 {
  	margin: 0 !important;
  }

  .toc-js ul {
  	margin-bottom: 0;
  }

  .toc-js ul > li {
  	padding: 0 !important;
  	border: none !important;
  }

  .toc-js ul > li a {
  	padding-top: 24px;
  	padding-bottom: 24px;
  	border: none !important;
  	color: #000 !important;
  	
  	/* H6 */
  	font-family: "Open Sans";
  	font-size: 20px;
  	font-style: normal;
  	font-weight: 600;
  	line-height: 130%; /* 26px */
  	transition: 0.3s;
  }

  .toc-js ul > li a:hover, .toc-js ul > li a:active {
  	background: rgba(198,218,231,0.3) !important;
  }

  .toc-js ul > .toc-active a {
  	padding-left: 24px;
  }

  main span[id^="toc"] + h2, main span[id^="toc"] + h3 {
  	border-bottom: none;
  }

  @media screen and (min-width: 992px) and (max-width: 1199px) {
    .toc-js.sticky.is-sticked {
      position: relative !important;
    }
  }

  @media screen and (max-width: 1199px) {
  	.toc-js {
  		margin-bottom: 50px;
  	}
  }



  /* ==========================================================================
  		Profile Styling
  ============================================================================= */

  /* Profile field label gaps*/

  .field--label-inline {
  	display: flex;
  	gap: .5em;
  }

  /* Profile email text customizations*/

  .field--name-field-profile-email > .field__item {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Remove country from address */

  p.address > .country {
  	display: none;
  }

  /** Remove weird spacing on organizations on individual profile pages **/

  .node--type-osu-profile .field--name-field-osu-organizations .field__items {
  	display: block;
  }

  /* Controls image width in various areas of profile tables */

  .coe-profile-image-360 {
  	border-right: 1px solid #ccc !important;
    padding: 20px;
    text-align: center;
  }
  .coe-profile-image-360 img {
  	min-width: 260px;
  	width: 260px;
  }
