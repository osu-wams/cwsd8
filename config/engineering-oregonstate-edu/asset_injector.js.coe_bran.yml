id: coe_bran
label: 'COE Brand Blocks'
code: |
  /*==============================
  	COE Accordions
  ================================*/
  const coe_accordions = document.querySelectorAll(".paragraph--type--coe-accordion-content");

  coe_accordions.forEach((el) => {
    const btn = el.querySelector(".field--name-field-coe-acc-section-titl, .field--name-field-coe-accordion-title");
    const content = el.querySelector(".field--name-field-coe-accordion-section-body");
    if (!btn || !content) return;

    btn.addEventListener("click", () => {
      const opening = !el.classList.contains("accordion-open");
      el.classList.toggle("accordion-open", opening);

      if (opening) {
        content.style.display = "block";        // give it a layout box first
        const target = content.scrollHeight;    // now a real number
        content.style.maxHeight = "0px";
        content.offsetHeight;                   // force reflow: commit the 0px start state
        content.style.maxHeight = target + "px";
      } else {
        content.style.maxHeight = content.scrollHeight + "px"; // replace "none" with a number
        content.offsetHeight;                   // force reflow
        content.style.maxHeight = "0px";
      }
    });

    content.addEventListener("transitionend", (e) => {
      if (e.target !== content || e.propertyName !== "max-height") return;

      if (el.classList.contains("accordion-open")) {
        content.style.maxHeight = "none";       // let content resize freely while open
      } else {
        content.style.display = "";             // back to CSS default (none) only after collapse
        content.style.maxHeight = "";
      }
    });
  });

  /*==============================
  	Animated Ticker
  ================================*/
  const tickerButtons = document.querySelectorAll(".animated-ticker-button");

  tickerButtons.forEach(button => {
  	const tickerContent = button.closest(".animated-ticker")?.querySelector(".animated-ticker-content");

  	if (!tickerContent) return;

  	// Start paused if reduced motion is preferred (WCAG Accessibility)
  	let tickerPaused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  	const pauseSVG = '<svg width="18" height="18" viewBox="0 0 13 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0 18V0h4v18zM13 0v18H9V0z" fill="currentColor"/></svg>';
  	const playSVG = '<svg width="16" height="16" viewBox="-2 0 13 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 8 0 16V0z" fill="currentColor"/></svg>';

  	function updateTickerButton() {
  		// Update play/pause icons
  		button.innerHTML = tickerPaused ? playSVG : pauseSVG;

  		// Update aria-label
  		button.setAttribute("aria-label", tickerPaused ? "Play Animation" : "Pause Animation");

  		// Update animation play state
  		tickerContent.style.animationPlayState = tickerPaused ? "paused" : "running";
  	}

  	// Toggle pause state and update button on click
  	button.addEventListener("click", () => {
  		tickerPaused = !tickerPaused;
  		updateTickerButton();
  	})

  	updateTickerButton();
  });
