langcode: en
status: true
dependencies:
  module:
    - node
    - system
id: coe_brand_research_area_content_type
label: 'Content Type - Research Area'
code: |-
  .coe-research-hero > .container > .layout > .col-12 { 
  	display: flex; 
  	flex-direction: column-reverse; 
  	gap: 10px;
  }


  .field--name-field-coe-article-module-body{
  	width: 100%;
  }

  @media (min-width: 1200px){
  .field--name-field-coe-article-module-body{
  	width: 67%;
  }
  }

  /*
  Labs section
  */

  @media (min-width: 992px) {
    .paragraph--type--coe-image-and-text {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      align-items: flex-start;
      justify-content: space-between;
    }

    .paragraph--type--coe-image-and-text > .field--name-field-coe-text-image-text {
      width: 50% !important;
      max-width: 50% !important;
      flex: 0 0 50% !important;
    }

  }

  @media (max-width: 991px) {
    .field--name-field-coe-research-area-sections .paragraph--type--coe-image-and-text .field--name-field-media-image {
      margin-top: 50px;
    }
  }

  .field--name-field-coe-image-style {
    display: none;
  }

  .field--name-field-coe-research-area-sections > .field__item { 
    margin-bottom: 80px; 
  }

  .field--name-field-coe-text-image-text h2 {
    margin-bottom: 20px;
  }



  /************************************************************************

  	SECTION: Image Box Shadow Color
  	
  	PURPOSE: Applies a box shadow color to images
  	
  	INSTRUCTIONS:
  		1. Insert class name (ex. img-bottom-left-hop-bine) into block 
  		2. Configure > Manage Attributes > Block content attributes
  ************************************************************************/


  .block-field-blocknoderesearch-areafield-labs-image-box-shadow span {
    display: none;
  }

  /* High Tide shadow */
  .field--name-field-coe-image-style:has(.img-bottom-right-high-tide)
    ~ .field--name-field-coe-image-image-and-text img {
      box-shadow: 15px 15px 0 #00859B;
      margin-bottom: 25px;
      width: calc(100% - 15px);
  }

  /* Hop-Bine shadow */
  .field--name-field-coe-image-style:has(.img-bottom-right-hop-bine)
    ~ .field--name-field-coe-image-image-and-text img {
      box-shadow: 15px 15px 0 #AA9D2E;
      margin-bottom: 25px;
      width: calc(100% - 15px);
  }

  /* Yellow shadow */
  .field--name-field-coe-image-style:has(.img-bottom-right-luminance)
  	~ .field--name-field-coe-image-image-and-text img {
  	box-shadow: 15px 15px 0 #FFB500;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }

  /* Pine stand */
  .field--name-field-coe-image-style:has(.img-bottom-right-pine-stand)
  	~ .field--name-field-coe-image-image-and-text .field__item img {
  	box-shadow: 15px 15px 0 #4A773C;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }

  /* Solar Flare */
  .field--name-field-coe-image-style:has(.img-bottom-right-solar-flare)
   ~ .field--name-field-coe-image-image-and-text .field__item img {
  	box-shadow: 15px 15px 0 #D3832B;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }

  /* Rogue Wave */
  .field--name-field-coe-image-style:has(.img-bottom-right-rogue-wave)
   ~ .field--name-field-coe-image-image-and-text .field__item img {
  	box-shadow: 15px 15px 0 #0D5257;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }

  /* Orange */
  .field--name-field-coe-image-style:has(.img-bottom-right-orange)
   ~ .field--name-field-coe-image-image-and-text .field__item img {
  	box-shadow: 15px 15px 0 #d73f09;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }

  /* Seafoam */
  .field--name-field-coe-image-style:has(.img-bottom-right-seafoam)
  	~ .field--name-field-coe-image-image-and-text .field__item img {
  	box-shadow: 15px 15px 0 #B8DDE1;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }

  /* Stratosphere */
  .field--name-field-coe-image-style:has(.img-bottom-right-stratosphere)
  	~ .field--name-field-coe-image-image-and-text .field__item img {
  	box-shadow: 15px 15px 0 #006A8E;
  	margin-bottom: 25px;
  	width: calc(100% - 15px);
  }

  .field--name-field-image-w-text-entry {
  	display: flex;
  	flex-wrap: wrap;
  	justify-content: space-between;
  	row-gap: 50px;
  }

  .field--name-field-image-w-text-entry > .field__item {
  	width: calc(50% - 10px);
  }

  @media screen and (max-width: 991px) {
  	.field--name-field-image-w-text-entry > .field__item {
  		width: 100%;
  	}
  }

  .field--name-field-image-w-text-entry > .field__item img {
  	object-fit: cover;
  	height: 300px;
  	object-position: center;
  	width: 100%;
  	margin-bottom: 20px;
  }

  .field--name-field-image-w-text-entry > .field__item h3 {
  	color: var(--Primary-Paddletail-Black, #000);
  	font-family: Stratum2Web;
  	font-size: 24px;
  	font-style: normal;
  	font-weight: 900;
  	line-height: 130%; /* 31.2px */
  	letter-spacing: 1.2px;
  	text-transform: uppercase;
  }

  .field--name-field-image-w-text-entry > .field__item .field--name-field-coe-2-col-img-txt-link a{
  	font-family: Stratum2Web;
  	font-size: 20px;
  	font-style: normal;
  	font-weight: 500;
  	line-height: normal;
  	letter-spacing: 1px;
  	text-transform: uppercase;
  	color: #D73F09 !important;
  	text-decoration: none !important;
  	background-image: url(/modules/custom/osu_custom_blocks/dist/arrow-right-red.c4e9b645.svg);
    background-position: 100%;
    background-repeat: no-repeat;
    background-size: 20px;
    padding-right: 25px;
    margin-right: 10px;
    margin-top: 18px;
    transition: 0.2s ease;
    border-bottom: none;
  }

  .field--name-field-image-w-text-entry > .field__item .field--name-field-coe-2-col-img-txt-link a:hover {
  	padding-right: 35px;
  	margin-right: 0px;
  	border-bottom: none;
  }

  .field--name-field-image-w-text-entry > .field__item .field--name-field-coe-2-col-img-txt-link a:focus,
  .field--name-field-image-w-text-entry > .field__item .field--name-field-coe-2-col-img-txt-link a:active {
  	background-color: transparent !important;
  	color: #BE3706 !important;
  	padding-right: 35px !important;
  	border-bottom: none !important;
  }

  .field--name-field-image-w-text-entry > .field__item .field--name-field-coe-2-col-img-txt-link {
  	margin-top: 20px;
  }
media: all
preprocess: true
conditions:
  'entity_bundle:node':
    id: 'entity_bundle:node'
    negate: false
    context_mapping:
      node: '@node.node_route_context:node'
    bundles:
      research_area: research_area
  request_path:
    id: request_path
    negate: true
    pages: '/*/edit'
contexts: {  }
conditions_require_all: true
