id: coe_brand_cards
label: 'COE Brand - Cards'
code: |-
  /* Consolidated cards go here */

  /*================================================================================================================================================================
  	SECTION: Image Text Cards
  	
  	PURPOSE: Styles cards with an image, and a text title beneath it. Used on Oregon Stater Awards.
  	==============================================================================================================================================================*/
  .image-text-cards {
  	position: relative;
  	box-sizing: border-box;
  	width: 100%;
  	height: 100%;
  	flex-shrink: 0;
  	overflow: hidden;
  	border: 2px solid #F8F9FA;
  	border-radius: 5px;
  	background-color: #FFF;
  	box-shadow: 2px 4px 8px 0 rgba(0, 0, 0, 0.08);
  	transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
  }

  .image-text-cards:hover,
  .image-text-cards:active {
  	background-color: #F9FCFD;
  	box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.08);
  }

  .image-text-cards:has(:focus-visible) {
  	background-color: #F9FCFD;
  	border-color: #D73F09;
  	box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.08);
  }

  .image-text-cards img {
  	display: block;
  	width: 100%;
  	height: auto;
  }

  .image-text-cards a,
  .image-text-cards a:hover,
  .image-text-cards a:focus,
  .image-text-cards a:active {
  	background-color: transparent !important;
  	color: #000 !important;
  	text-decoration: none;
  	border-bottom: none;
  }

  /* Tablet */
  @media (min-width: 415px) and (max-width: 991px) {
  	.image-text-cards {
  		width: 75%;
  		margin-inline: auto;
  	}
  }

  /*================================================================================================================================================================
  	SECTION: NEW COMBINED CARD STYLING
  	
  	PURPOSE: This will eventually replace all card styling.
  	CREATED: 9/17/2026
  	==============================================================================================================================================================*/

  /*==================================================
      MAIN
  ===================================================*/
  .vertical-card {
      border: 1px solid #F8F9FA;
      border-radius: 5px;
      background: #FFF;
      box-shadow: 2px 4px 8px 0px rgba(0, 0, 0, 0.08);
      height: 100%;
      transition: .3s;
      position: relative;
  }

  .vertical-card:hover {
      background: #F9FCFD !important;
      transition: .3s;
      box-shadow: 0px 1px 3px 0px rgba(0, 0, 0, 0.08) !important;
  }

  .vertical-card a {
      text-decoration: none !important;
  }

  /*==================================================
      IMAGE
  ===================================================*/
  .vertical-card img {
      border-radius: 5px 5px 0 0 !important;
      object-fit: cover;
      width: 100%;
  }

  .vertical-card .h-250-img img {
      height: 250px;
  }

  .vertical-card .ar-9-11-img img {
  	aspect-ratio: auto 1350 / 1650;
  }

  .vertical-card:has(.h-250-img) .card-body {
      height: calc(100% - 250px);
  }

  .vertical-card:has(.ar-9-11-img) .card-body {
  	height: calc(100% - 1.22 * 100cqw);
  }

  /*==================================================
      BODY
  ===================================================*/
  .vertical-card .card-body {
      height: 100%;
      display: flex;
      flex-direction: column;

      padding: 30px;
  }

  /*==================================================
      LABEL
  ===================================================*/
  .vertical-card .label
  {
      color: var(--Secondary-High-Tide, #00859B);
      font-feature-settings: 'liga' off, 'clig' off;
      padding-bottom: 20px;
      margin-bottom: 0;
      /* Main/Label */
      font-family: "Open Sans";
      font-size: 12px;
      font-style: normal;
      font-weight: 700;
      line-height: 160%;
      letter-spacing: 0.6px;
      text-transform: uppercase;
  }

  /*==================================================
      TITLE
  ===================================================*/
  .vertical-card :is(.h3, .h4, .h5, .h6, .p-strong) {
      padding-bottom: 0;
      margin: 0;
  }

  .vertical-card:has(.card-text, .card-arrow-link) :is(.h3, .h4, .h5, .h6, .p-strong) {
      padding-bottom: 10px;
      margin: 0;
  }

  .vertical-card :is(.h3, .h4, .h5, .h6, .p-strong) a:hover,
  .vertical-card :is(.h3, .h4, .h5, .h6, .p-strong) a:focus,
  .vertical-card :is(.h3, .h4, .h5, .h6, .p-strong) a:active,
  .vertical-card a:is(.h3, .h4, .h5, .h6, .p-strong):hover,
  .vertical-card a:is(.h3, .h4, .h5, .h6, .p-strong):focus,
  .vertical-card a:is(.h3, .h4, .h5, .h6, .p-strong):active {
  	color: #000 !important;
  	border-bottom: transparent;
  }

  .vertical-card .h3
  {
  	color: var(--Primary-Paddletail-Black, #000);
  	
  	/* Main/H3 */
  	font-family: Stratum2Web;
  	font-size: 36px;
  	font-style: normal;
  	font-weight: 900;
  	line-height: 130%;
  	text-transform: none;
  }

  .vertical-card .h4
  {
  	color: var(--Primary-Paddletail-Black, #000);
  	
  	/* Main/H4 */
  	font-family: Stratum2web;
  	font-size: 24px;
  	font-style: normal;
  	font-weight: 900;
  	line-height: 130%;
  	letter-spacing: 1.2px;
  	text-transform: uppercase;
  }

  .vertical-card .h5
  {
  	color: var(--Primary-Paddletail-Black, #000);

      /* Main/H5 */
  	font-family: "Open Sans";
  	font-size: 22px;
  	font-style: normal;
  	font-weight: 700;
  	line-height: 130%;
  	letter-spacing: 1.1px;
  	text-transform: uppercase;
  }

  .vertical-card .h6
  {
      color: var(--Primary-Paddletail-Black, #000);

      /* Main/H6 */
      font-family: "Open Sans";
      font-size: 20px;
      font-style: normal;
      font-weight: 600;
      line-height: 130%;
  }

  .vertical-card:not(:has(.card-text)):has(.card-arrow-link) :is(.h3, .h4, .h5, .h6, .p-strong) {
      padding-bottom: 30px;
  }

  /*==================================================
      TEXT
  ===================================================*/
  .vertical-card .card-text{
      color: #000;
      font-family: "Open Sans";
      font-size: 18px;
      font-style: normal;
      font-weight: 400;
      line-height: normal;
      margin-bottom: 0;
      padding-bottom: 30px;
      flex-grow: 1;
  }

  /*==================================================
      ARROW LINK
  ===================================================*/
  .vertical-card .card-arrow-link {
      padding: 0;
      margin: 0;
      margin-top: auto;
  }

  .vertical-card .card-arrow-link a {
      color: #D73F09;
      font-family: Stratum2Web;
      font-size: 20px;
      font-style: normal;
      font-weight: 500;
      line-height: normal;
      letter-spacing: 1px;
      text-transform: uppercase;

      background-image: url(/modules/custom/osu_custom_blocks/dist/arrow-right-red.c4e9b645.svg);
      background-position: 100%;
      background-repeat: no-repeat;
      background-size: 20px;

      padding-right: 25px;
      margin-right: 10px;

      transition: 0.2s ease;
      border-bottom: none;
  }

  /* Orange Arrow Links Hover State */
  .vertical-card .card-arrow-link a:hover {
      padding-right: 35px;
      margin-right: 0px;
      border-bottom: none;
  }

  /* Orange Arrow Links Active State */
  .vertical-card .card-arrow-link a:focus,
  .vertical-card .card-arrow-link a:active {
      background-color: transparent !important;
      color: #BE3706 !important;

      padding-right: 35px !important;
      border-bottom: none !important;
  }
