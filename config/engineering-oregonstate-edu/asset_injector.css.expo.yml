  /*===================================
  	Industry form background
  =====================================*/

  .industry-form-background {
  	position: relative;
  }

  .industry-form-background::before {
  	content: "";
  	position: absolute;

  	bottom: 100px;
  	right: max(100px, calc((100% - 1400px) / 2 + 100px));
  	width: 50%;
  	max-width: 750px;
  	height: calc(100% - 100px);

  	background-image: url('/sites/engineering.oregonstate.edu/files/2026-10/industry-form-satellite.svg');
  	background-repeat: no-repeat;
  	background-size: contain;
  	background-position: right bottom;

  	z-index: 1;
  }

  /* keep content above background */
  .industry-form-background > * {
  	position: relative;
  	z-index: 2;
  }

  /* Tablet */
  @media screen and (min-width: 768px) and (max-width: 1199px) {
  	.industry-form-background::before {
  		bottom: 50px;
  		right: 50px;
  		width: 70%;
  		height: calc(100% - 50px);
  	}
  }

  /* Mobile */
  @media screen and (max-width: 767px) {
  	.industry-form-background::before {
  		bottom: 20px;
  		right: 20px;
  		width: 90%;
  		height: calc(100% - 20px);
  	}
  }

