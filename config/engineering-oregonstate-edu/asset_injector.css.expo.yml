  /*===================================
  	Campaign hero section
  =====================================*/

  .crosshairs-hero-image-wrapper {
  	position: relative;
  }

  .crosshairs-hero-image-wrapper::before {
  	content: "";
  	position: absolute;

  	top: 5%;
  	left: -1%;
  	width: 100%;
  	height: 50%;

  	background-image: url('/sites/engineering.oregonstate.edu/files/2026-05/crosshairs-grid-hero-pattern.svg');
  	background-repeat: repeat-x;
  	background-size: 100% auto;
  	background-position: top;
  	transform: scale(1.4);
  	overflow: hidden;

  	z-index: 1;
  }

  /* keep image above background */
  .crosshairs-hero-image-wrapper img {
  	position: relative;
  	z-index: 2;
  }

  /* Tablet */
  @media screen and (min-width: 768px) and (max-width: 1199px) {
  	.crosshairs-hero-image-wrapper::before {
  		background-image: url('/sites/engineering.oregonstate.edu/files/2026-05/crosshairs-grid-tablet-hero-pattern.svg');
  		transform: scale(1.25);
  		top: 4%;
  		left: -8%;
  	}
  }

  /* Mobile */
  @media screen and (max-width: 767px){
  	.crosshairs-hero-image-wrapper::before {
  		top: -18%;
  		left: 0;

  		background-image: url('/sites/engineering.oregonstate.edu/files/2026-05/crosshairs-grid-mobile-hero-pattern.svg');
  		background-size: 100% auto;
  		transform: scale(0.95);
  	}
  }

  /*===================================
  	Paying for college hero section
  =====================================*/
  .college-hero-background-pattern {
      position: relative;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
  }

  .college-hero-background-pattern img {
      z-index: 0;
      position: absolute;
      top: 0;
      /*right: max(0px, calc((100vw - 1440px) / 2));*/
      right: 0;
      max-width: 98%;
      width: 1000px;
      height: 250px;
      object-fit: contain;
      object-position: right top;
  }

  /* Scholarship content */
  /*.block--type-basic {*/
  /*    position: relative;*/
  /*    z-index: 1;*/
  /*}*/

  .college-hero-background-pattern figure:has(.media--view-mode-frameless),
  .college-hero-background-pattern .media--view-mode-frameless img {
      width: auto !important;
  }

  /* Small desktop size of background pattern */
  @media only screen and (max-width: 1399px) {
      .college-hero-background-pattern img {
          right: max(0px, calc(calc(100vw - 1255px) / 2));
          /*right: 0;*/
          /*width: 900px;*/
          /*height: 250px;*/
          /*right: 0;*/
          height: 150px;
  				width: auto;
  				max-width: none;
          /*object-fit: contain;*/
          /*object-position: right top;*/
      }
  }

  /* Large tablet and tablet: hide background pattern */
  @media only screen and (max-width: 991px) {
      .college-hero-background-pattern img {
          display: none;
      }
  }

