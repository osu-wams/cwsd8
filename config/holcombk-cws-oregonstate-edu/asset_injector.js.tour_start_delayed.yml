id: tour_start_delayed
label: 'Delayed Tour Start'
code: |-
  (function (Drupal, drupalSettings) {
    Drupal.behaviors.delayedTourStart = {
      attach: function (context, settings) {
        if (!context.querySelector('body').classList.contains('delayed-tour-init')) {
          context.querySelector('body').classList.add('delayed-tour-init');

          const params = new URLSearchParams(window.location.search);
          if (params.has('tour')) {
            // Wait for full page load
            window.addEventListener('load', function () {
              if (Drupal.tour && typeof Drupal.tour.start === 'function') {
                Drupal.tour.start();
              } else {
                console.warn('Tour API not available.');
              }
            });
          }
        }
      }
    };
  })(Drupal, drupalSettings);
