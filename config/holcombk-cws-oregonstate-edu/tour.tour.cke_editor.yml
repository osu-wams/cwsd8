uuid: 76b9e2d6-ecc0-4ced-9c28-9be6713c94c1
langcode: en
status: false
dependencies:
  enforced:
    module:
      - ''
id: cke_editor
label: CKEditor
routes:
  -
    route_name: entity.node.edit_form
  -
    route_name: node.add
tips:
  bold:
    id: bold
    plugin: text
    label: Bold
    weight: 1
    position: bottom-end
    selector: .cke_button__bold_icon
    body: "<p>Add or remove bold styling to the selected text.</p>\r\n<p>Use the bold treatment sparingly as it can negatively affect the tone of your content and make your readers blind to it if you bold excessively.</p>"
  itallic:
    id: itallic
    plugin: text
    label: Italic
    weight: 1
    position: bottom-end
    selector: .cke_button.cke_button__italic
    body: '<p>Add or remove italic styling to the selected text. Just as with bold text, use this sparingly to emphasize the most important of your content.</p>'
  spell_check_as_you_type:
    id: spell_check_as_you_type
    plugin: text
    label: 'Spell Check As You Type'
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__scayt_icon
    body: "<p>The Spell Check As You Type (SCAYT) automatically checks and highlights spelling errors while you type.</p>\r\n<p><strong>Note:</strong> sometimes this spellchecker can take a few moments to run. Make sure to give you content a final look to ensure the aren't any spelling errors before publishing your page.</p>"
  remove_format:
    id: remove_format
    plugin: text
    label: 'Remove Format'
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__removeformat_icon
    body: "<p>The <strong>Remove Format</strong> button clears text formatting (like bold, italics, font from Outlook or Word, and colors) while keeping the text intact.</p>\r\n<p>If you are copy and pasting from Outlook, Word, or a PDF, then there additional artifacts from these platforms that may not get stripped by this button that can negatively affect the appearance of your content or affect the expected behavior of that content.</p>"
  left_align:
    id: left_align
    plugin: text
    label: 'Align Left '
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__justifyleft_icon
    body: '<p>Aligning content to the left is the preferred alignment for content in English. Use other alignments sparingly.</p>'
  center:
    id: center
    plugin: text
    label: Center
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__justifycenter_icon
    body: '<p>Centering content should be reserved for short blocks of text only. Long blocks of centered text are harder to read and can frustrate your visitors. WebAIM has an article on <a href="https://webaim.org/techniques/textlayout/" target="_blank">Text/Typographical Layout</a> that covers each text alignment and how it impacts users.</p>'
  align_right:
    id: align_right
    plugin: text
    label: 'Align Right'
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__justifyright_icon
    body: '<p>Aligning text to the right for English content should be reserved for specific scenarios and not used for long blocks of text as it impacts readability.</p>'
  justify:
    id: justify
    plugin: text
    label: Justify
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__justifyblock_icon
    body: '<p>The Justify icon stretches the text to fill the space. It is not a commonly recommended alignment for readability on the web.</p>'
  linkit:
    id: linkit
    plugin: text
    label: 'Add a Link'
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__drupallink_icon
    body: '<p>You can add or edit hyperlinks using the Linkit tool. If you are linking to another page in your website, you should use the search feature in the Linkit popup triggered by this button. Read up on <a href="https://oregonstateuniversity.sharepoint.com/sites/Drupal/SitePages/Links.aspx#to-create-an-internal-link" target="_blank">how to properly link</a> in Drupal in the How-tos.</p>'
  unlink:
    id: unlink
    plugin: text
    label: Unlink
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__drupalunlink_icon
    body: '<p>The unlink icon removes a hyperlink from the selected text, turning it back into plain text.</p>'
  insert_remove_bulleted_list:
    id: insert_remove_bulleted_list
    plugin: text
    label: 'Insert/Remove Bulleted List'
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__bulletedlist_icon
    body: "<p>The Insert/Remove Bulleted List lets you add or remove bullet points in your text.</p>\r\n<p>If you have already added a bulleted list, you can right click on it to access the <strong>Bulleted List properties</strong>. Please note that changing these properties doesn't change the appearance of the bullets as those are set by the theme code. For usability and accessibility, please don't override the theme styles.</p>"
  inser_remove_numbered_list:
    id: inser_remove_numbered_list
    plugin: text
    label: 'Insert/Remove Numbered List'
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__numberedlist_icon
    body: "<p>The Insert/Remove Numbered List toggles a numbered list on or off for the selected text.</p>\r\n<p>If you have already added a numbered list, you can right click on any numbered list item to access the <strong>Numbered List Properties</strong>. You can set what number to start from or change the list type (use roman numerals, etc.)</p>"
  outdent:
    id: outdent
    plugin: text
    label: Outdent
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__outdent_icon
    body: '<p>The Outdent decreases the indentation of the selected text or list item.</p>'
  indent:
    id: indent
    plugin: text
    label: Indent
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__indent_icon
    body: "<p>The Indent increases the indentation (moves text further to the right).</p>\r\n<p>If you have a list (numbered or bulleted) you can nest list items using this button.</p>"
  icon:
    id: icon
    plugin: text
    label: Icon
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__osu_icons_icon
    body: "<p>This icon allows you to choose between the OSU brand and <a href=\"https://fontawesome.com/search?ic=free\" target=\"_blank\">FontAwesome</a> sets of icons. Use one style of icons per page.</p>\r\n<p>Further guidance about icons can be found in the <a href=\"https://drupal.oregonstate.edu/site-building-guide/elements#toc-icons\" target=\"_blank\">Site Building Guide elements page</a>.</p>"
  block_quote:
    id: block_quote
    plugin: text
    label: 'Block Quote'
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__blockquote_icon
    body: "<p>This icon formats selected text as a blockquote, which means it is visually distinguished to indicate a quoted section.</p>\r\n<p>This is a semantic HTML element, which means that it is used by screen readers to indicate a quote. This means that you should only style text that is a quote, and not use it just for the styling.</p>"
  insert_media:
    id: insert_media
    plugin: text
    label: 'Insert Media'
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__drupalmedialibrary_icon
    body: '<p>This button allows you to add images, documents or embed YouTube/Kaltura videos from the media library to your content. You can find more information on <a href="https://oregonstateuniversity.sharepoint.com/sites/Drupal/SitePages/Media.aspx" target="_blank">how to work with media</a> in the Drupal how-tos.</p>'
  table:
    id: table
    plugin: text
    label: Table
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__table_icon
    body: "<p>Allows you to insert and edit tables in your content. Tables should be used for data and not for layout--if you need multiple columns, use layout builder. For more details about working with tables, read the Drupal <a href=\"https://drupal.oregonstate.edu/site-building-guide/elements#toc-tables\" target=\"_blank\">guide to tables</a>. Review the accessibility website for more details and <a href=\"https://accessibility.oregonstate.edu/web/tables\" target=\"_blank\">guidance on when/where to use tables</a>.</p>\r\n"
  special_character:
    id: special_character
    plugin: text
    label: 'Special Character'
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__specialchar_icon
    body: '<p>The Insert Special Character icon allows you to add symbols like ©, ™, €, and mathematical characters into your text.</p>'
  horizontal_line:
    id: horizontal_line
    plugin: text
    label: 'Horizontal Line'
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__horizontalrule_icon
    body: '<p>This icon adds a horizontal divider across the page. By default, it will have 2rem or 32pixels of padding top and bottom.</p>'
  styles:
    id: styles
    plugin: text
    label: Styles
    weight: 1
    position: bottom-end
    selector: .cke_combo_text.cke_combo_inlinelabel
    body: "<p>The Styles drop-down can be used to style and size text. You can see examples of the <a href=\"https://drupal.oregonstate.edu/site-building-guide/elements#toc-display-font-sizes\" target=\"_blank\">display styles</a> and the <a href=\"https://drupal.oregonstate.edu/site-building-guide/elements#toc-font-sizes\" target=\"_blank\">font sizes</a> available.</p>\r\n<p><strong>Note:</strong> Display fonts shouldn't be used in place of headings that provide structure to your webpage. Headings should still be used appropriately to provide a well structured page for those who use screen readers. Review the <a href=\"https://accessibility.oregonstate.edu/web/headings\" target=\"_blank\">headings accessibility page</a> for more information.</p>"
  normal:
    id: normal
    plugin: text
    label: Format
    weight: 1
    position: bottom-end
    selector: '#cke_10.cke_combo.cke_combo__format'
    body: "<p>The Format drop-down is for applying headings to your text or reverting them back to regular paragraph text. Headings should be used to structure your webpage and not selected for purely styling purposes.</p>\r\n<p><a href=\"https://drupal.oregonstate.edu/site-building-guide/elements#toc-headings\" target=\"_blank\">Examples of all the headings</a> and <a href=\"https://accessibility.oregonstate.edu/web/headings\" target=\"_blank\">guidance on how to use headings</a>.</p>"
  button:
    id: button
    plugin: text
    label: Button
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__osu_buttons_icon
    body: "<p>This <strong>BTN</strong> icon will give you an option to create a colored button that links to another page. <a href=\"https://drupal.oregonstate.edu/site-building-guide/elements#toc-buttons\" target=\"_blank\">Examples of all the styles and sizes</a>.</p>\r\n<p><strong>Tip:</strong> If you need to edit an existing button, it is easiest to erase the exiting button and create one from scratch as the editing experience is finicky.</p>"
  create_div_container:
    id: create_div_container
    plugin: text
    label: 'Create Div Container'
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__creatediv_icon
    body: "<p>This icon inserts a &lt;div&gt; element, which you can use to group content and apply styles. For most styling, please use Layout Builder. This div option should only be used by those who have a strong understanding of HTML, CSS and their implications on accessibility.</p>\r\n"
  show_blocks:
    id: show_blocks
    plugin: text
    label: 'Show Blocks'
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__showblocks_icon
    body: '<p>The Show Blocks button highlights the structure of the content by outlining block-level elements like paragraphs, headings, and divs. This is helpful for those familiar with HTML to understand the structure of the content.</p>'
  source:
    id: source
    plugin: text
    label: Source
    weight: 1
    position: bottom-end
    selector: .cke_button.cke_button__source.cke_button_off
    body: "<p>The <strong>Source</strong> icon lets you view and edit the raw HTML code of the content.</p>\r\n<p>The most common application is to paste code for an iframe or other widget from another platform, such as the OSU Events platform (Localist) or Ideal-Logic. If you want to embed a video, you want to use the <strong>Media</strong> button. (<a href=\"https://oregonstateuniversity.sharepoint.com/sites/Drupal/SitePages/Media.aspx#how-to-embed-a-youtube-video\" target=\"_blank\">Embed instructions for YouTube or Kaltura videos</a>).</p>\r\n<p><strong>Note:</strong> there is a known bug with switching to the source code. When you are done with your changes, be sure to switch back away from source code, or else all your changes will be lost.</p>"
  maximize:
    id: maximize
    plugin: text
    label: Maximize
    weight: 1
    position: bottom-end
    selector: .cke_button_icon.cke_button__maximize_icon
    body: '<p>This button expands the editor to full screen for a larger editing area.</p>'
